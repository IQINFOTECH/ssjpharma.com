<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Pharmaceutical laboratory illustration">
  <defs>
    <linearGradient id="hlBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041d43"/><stop offset=".55" stop-color="#062B63"/><stop offset="1" stop-color="#0757B8"/>
    </linearGradient>
    <linearGradient id="hlLiq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa3f0"/><stop offset="1" stop-color="#0757B8"/>
    </linearGradient>
    <linearGradient id="hlGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".08"/><stop offset="1" stop-color="#ffffff" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="hlGlow" cx=".5" cy=".4" r=".7">
      <stop offset="0" stop-color="#7cc0ff" stop-opacity=".5"/><stop offset="1" stop-color="#7cc0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="hlBlur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="hlBlurSm" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="640" height="560" fill="url(#hlBg)"/>
  <!-- depth: soft bokeh + backlight -->
  <ellipse cx="470" cy="150" rx="230" ry="180" fill="url(#hlGlow)"/>
  <circle cx="120" cy="110" r="46" fill="#5aa9f2" opacity=".14" filter="url(#hlBlur)"/>
  <circle cx="560" cy="330" r="60" fill="#7cc0ff" opacity=".12" filter="url(#hlBlur)"/>
  <circle cx="240" cy="60" r="26" fill="#9ed1ff" opacity=".16" filter="url(#hlBlurSm)"/>
  <!-- faint molecular lattice -->
  <g stroke="#9ec6f5" stroke-width="1" opacity=".14" fill="none">
    <path d="M70 430l46-26 46 26v52l-46 26-46-26zM162 404l44-24M116 482v46"/>
    <circle cx="70" cy="430" r="4" fill="#9ec6f5"/><circle cx="162" cy="430" r="4" fill="#9ec6f5"/><circle cx="116" cy="404" r="4" fill="#9ec6f5"/>
  </g>
  <!-- bench line -->
  <path d="M0 470 H640" stroke="#9ec6f5" stroke-opacity=".28" stroke-width="2"/>
  <rect x="0" y="470" width="640" height="90" fill="#041d43" opacity=".55"/>

  <!-- microscope (background, softly out of focus) -->
  <g filter="url(#hlBlurSm)" opacity=".8" stroke="#cfe4fb" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M494 462h116M516 462v-16h72v16M552 446c-44-4-72-38-72-84"/>
    <path d="M480 362l30-56 26 14-30 56z" fill="#cfe4fb" stroke="none" opacity=".9"/>
    <circle cx="521" cy="296" r="9" fill="#cfe4fb" stroke="none"/>
  </g>

  <!-- Erlenmeyer flask with blue liquid -->
  <g>
    <path d="M232 240v58l-58 122a20 20 0 0 0 18 29h124a20 20 0 0 0 18-29l-58-122v-58" fill="url(#hlGlass)" stroke="#e6f1fd" stroke-width="4" stroke-linejoin="round"/>
    <path d="M198 384l-24 50a12 12 0 0 0 11 15h138a12 12 0 0 0 11-15l-24-50z" fill="url(#hlLiq)" opacity=".92"/>
    <path d="M224 240h60" stroke="#e6f1fd" stroke-width="6" stroke-linecap="round"/>
    <circle cx="244" cy="410" r="6" fill="#bfe0ff" opacity=".85"/><circle cx="272" cy="428" r="4.5" fill="#bfe0ff" opacity=".7"/><circle cx="290" cy="404" r="3.5" fill="#bfe0ff" opacity=".6"/>
    <path d="M240 258v56" stroke="#ffffff" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- test-tube rack -->
  <g stroke-linecap="round">
    <rect x="352" y="380" width="128" height="14" rx="7" fill="#0a3d85" stroke="#9ec6f5" stroke-opacity=".5" stroke-width="2"/>
    <g fill="url(#hlGlass)" stroke="#e6f1fd" stroke-width="3.5">
      <path d="M368 300v130a12 12 0 0 0 24 0V300z"/><path d="M410 280v150a12 12 0 0 0 24 0V280z"/><path d="M452 312v118a12 12 0 0 0 24 0V312z"/>
    </g>
    <path d="M370 368v62a10 10 0 0 0 20 0v-62z" fill="url(#hlLiq)"/>
    <path d="M412 344v86a10 10 0 0 0 20 0v-86z" fill="url(#hlLiq)"/>
    <path d="M454 386v44a10 10 0 0 0 20 0v-44z" fill="url(#hlLiq)"/>
    <path d="M372 306v96M414 288v110" stroke="#ffffff" stroke-opacity=".4" stroke-width="3"/>
  </g>

  <!-- vials + capsules on bench -->
  <g>
    <rect x="96" y="418" width="34" height="52" rx="6" fill="url(#hlGlass)" stroke="#e6f1fd" stroke-width="3"/>
    <rect x="102" y="410" width="22" height="10" rx="3" fill="#cfe4fb"/>
    <rect x="140" y="432" width="28" height="38" rx="5" fill="url(#hlGlass)" stroke="#e6f1fd" stroke-width="3"/>
    <rect x="145" y="425" width="18" height="9" rx="3" fill="#cfe4fb"/>
    <g transform="rotate(-18 560 452)">
      <rect x="524" y="440" width="72" height="26" rx="13" fill="#f4f8fe"/>
      <rect x="524" y="440" width="36" height="26" rx="13" fill="#E31B23"/>
    </g>
    <circle cx="512" cy="500" r="12" fill="#f4f8fe"/><path d="M512 492v16M504 500h16" stroke="#c3d6ef" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
