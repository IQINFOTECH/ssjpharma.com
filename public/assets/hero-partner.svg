<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Partnership and distribution illustration">
  <defs>
    <linearGradient id="hpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041d43"/><stop offset=".55" stop-color="#062B63"/><stop offset="1" stop-color="#0757B8"/>
    </linearGradient>
    <radialGradient id="hpGlow" cx=".5" cy=".4" r=".7">
      <stop offset="0" stop-color="#7cc0ff" stop-opacity=".5"/><stop offset="1" stop-color="#7cc0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="hpBlur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="hpBlurSm" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="640" height="560" fill="url(#hpBg)"/>
  <ellipse cx="330" cy="190" rx="250" ry="200" fill="url(#hpGlow)"/>
  <circle cx="130" cy="110" r="46" fill="#5aa9f2" opacity=".14" filter="url(#hpBlur)"/>
  <circle cx="560" cy="340" r="60" fill="#7cc0ff" opacity=".12" filter="url(#hpBlur)"/>
  <g stroke="#9ec6f5" stroke-width="1" opacity=".15" fill="none">
    <path d="M480 100l46-26 46 26v52l-46 26-46-26z"/>
    <circle cx="480" cy="100" r="4" fill="#9ec6f5"/><circle cx="572" cy="100" r="4" fill="#9ec6f5"/>
  </g>
  <!-- delivery truck, softly blurred background -->
  <g filter="url(#hpBlurSm)" opacity=".7" stroke="#cfe4fb" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M416 430V340h96v90M512 372h44l26 32v26h-70"/>
    <circle cx="452" cy="436" r="15"/><circle cx="556" cy="436" r="15"/>
  </g>
  <!-- handshake (main) -->
  <!-- stroke-width is scaled by the 8.2x transform: 1.1 * 8.2 ~ 9px effective -->
  <g fill="none" stroke="#e6f1fd" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" transform="translate(96 150) scale(8.2)">
    <path d="m11 17 2 2a1 1 0 1 0 3-3"/>
    <path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/>
    <path d="m21 3 1 11h-2"/>
    <path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/>
    <path d="M3 4h8"/>
  </g>
  <!-- parcel boxes -->
  <g fill="rgba(255,255,255,.1)" stroke="#e6f1fd" stroke-width="5" stroke-linejoin="round">
    <rect x="96" y="404" width="76" height="58" rx="6"/>
    <path d="M96 428h76M134 404v24" fill="none"/>
    <rect x="184" y="424" width="58" height="38" rx="5"/>
  </g>
  <circle cx="500" cy="330" r="10" fill="#E31B23"/>
</svg>
