<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sample product illustration">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22357a"/><stop offset="1" stop-color="#2b4a9e"/>
    </linearGradient>
  </defs>
  <rect width="480" height="420" fill="url(#pg)"/>
  <g opacity="0.9">
    <!-- capsule -->
    <g transform="rotate(-22 170 150)">
      <rect x="96" y="120" width="150" height="60" rx="30" fill="#f4f6fb"/>
      <rect x="96" y="120" width="75" height="60" rx="30" fill="#d81f26"/>
      <rect x="96" y="120" width="150" height="60" rx="30" fill="none" stroke="rgba(0,0,0,.12)" stroke-width="2"/>
    </g>
    <!-- tablet -->
    <circle cx="330" cy="140" r="46" fill="#eef1fb"/>
    <path d="M330 108V172M298 140H362" stroke="#c3ccec" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- blister strip -->
  <g transform="translate(120 250)">
    <rect x="0" y="0" width="240" height="110" rx="12" fill="#eaf4ff" opacity="0.95"/>
    <g fill="#c9d8f2">
      <circle cx="42" cy="38" r="16"/><circle cx="98" cy="38" r="16"/><circle cx="154" cy="38" r="16"/><circle cx="210" cy="38" r="16"/>
      <circle cx="42" cy="78" r="16"/><circle cx="98" cy="78" r="16"/><circle cx="154" cy="78" r="16"/><circle cx="210" cy="78" r="16"/>
    </g>
  </g>
</svg>
